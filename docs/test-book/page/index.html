<title>EXAACT Test Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a fixed left index of areas and modules beside one working column of tests; summary first, detail on demand. */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#18212f; --muted:#5b6575; --line:#dfe3ea; --soft:#eef1f6;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e6edfc;
  --pass:#11795a; --pass-soft:#e2f4ec; --fail:#c0322b; --fail-soft:#fbe8e6; --block:#a35f00; --block-soft:#fbf0dd; --skip:#6b7280; --skip-soft:#eceef1;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --panel:#161d28; --ink:#e6eaf0; --muted:#9aa4b2; --line:#283244; --soft:#1c2533;
  --accent:#7ea2ff; --accent-ink:#0b1220; --accent-soft:#1d2a47;
  --pass:#46c08f; --pass-soft:#12301f; --fail:#ff7b72; --fail-soft:#3a1715; --block:#e3a64a; --block-soft:#33260f; --skip:#9aa4b2; --skip-soft:#232c3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --panel:#161d28; --ink:#e6eaf0; --muted:#9aa4b2; --line:#283244; --soft:#1c2533;
  --accent:#7ea2ff; --accent-ink:#0b1220; --accent-soft:#1d2a47;
  --pass:#46c08f; --pass-soft:#12301f; --fail:#ff7b72; --fail-soft:#3a1715; --block:#e3a64a; --block-soft:#33260f; --skip:#9aa4b2; --skip-soft:#232c3a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:500;color:var(--muted);margin-left:6px}
.meter{flex:1;min-width:180px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.meter .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 12px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,.st button:focus-visible,.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100% - 56px)}
.nav{border-right:1px solid var(--line);background:var(--panel);padding:12px 0 40px;overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px}
.nav h4{margin:14px 16px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav a{display:flex;justify-content:space-between;gap:8px;padding:5px 16px;text-decoration:none;color:var(--ink);font-size:13.5px}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .c{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
.nav a.mod{padding-left:28px;font-size:13px}
.main{padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 14px;max-width:72ch}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.filters select,.filters input{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 8px;min-width:0}
.filters input[type=search]{flex:1;min-width:160px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.case{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:0 0 8px}
.case>header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;cursor:pointer}
.case .id{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px;white-space:nowrap}
.case .tt{font-weight:600}
.case .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:11.5px;color:var(--muted)}
.tag.gap{border-color:var(--block);color:var(--block)}
.tag.live{border-color:var(--fail);color:var(--fail)}
.pill{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.s-pass{background:var(--pass-soft);color:var(--pass)} .s-fail{background:var(--fail-soft);color:var(--fail)}
.s-block{background:var(--block-soft);color:var(--block)} .s-skip{background:var(--skip-soft);color:var(--skip)} .s-none{background:var(--soft);color:var(--muted)}
.body{border-top:1px solid var(--line);padding:12px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:13.5px;margin-bottom:10px}
.kv b{color:var(--muted);font-weight:500}
.steps{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n{font-variant-numeric:tabular-nums;color:var(--muted);width:32px}
td.do{min-width:220px} td.ex{min-width:200px;color:var(--ink)}
.st{display:flex;gap:4px}
.st button{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:30px;height:28px;cursor:pointer;font-weight:700;font-size:12px}
.st button[data-v=p].on{background:var(--pass);color:#fff;border-color:var(--pass)}
.st button[data-v=f].on{background:var(--fail);color:#fff;border-color:var(--fail)}
.st button[data-v=b].on{background:var(--block);color:#fff;border-color:var(--block)}
tr.f td{background:var(--fail-soft)} tr.p td.do{color:var(--muted)}
.verdict{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0}
.verdict button{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 12px;cursor:pointer}
.verdict button.on[data-v=pass]{background:var(--pass);color:#fff;border-color:var(--pass)}
.verdict button.on[data-v=fail]{background:var(--fail);color:#fff;border-color:var(--fail)}
.verdict button.on[data-v=block]{background:var(--block);color:#fff;border-color:var(--block)}
.verdict button.on[data-v=skip]{background:var(--skip);color:#fff;border-color:var(--skip)}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:8px}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.shot{position:relative;width:128px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft)}
.shot img{display:block;width:100%;height:88px;object-fit:cover;cursor:zoom-in}
.shot .fn{font-size:11px;padding:3px 6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot .x{position:absolute;top:4px;right:4px;border:0;border-radius:4px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:11px;padding:2px 6px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:12px;text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.hist{font-size:12.5px;color:var(--muted);margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}
.tile h3{margin:0 0 6px;font-size:14.5px}
.tile .bar{margin:8px 0 4px}
.tile .n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sum{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 16px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:120px}
.sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}
.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:10px 14px;margin:0 0 14px;max-width:85ch}
.note.warn{border-left-color:var(--block)}
.prose{max-width:75ch} .prose li{margin:4px 0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);border-radius:var(--r);padding:8px 14px;z-index:60;font-size:13.5px}
.more{display:block;margin:10px auto}
.navtoggle{display:none}
@media (max-width:600px){.meter{order:3;flex-basis:100%}}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .nav{position:fixed;inset:56px auto 0 0;width:min(86vw,300px);z-index:20;transform:translateX(-102%);transition:transform .2s;max-height:none;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .nav.open{transform:none}
  .navtoggle{display:inline-block}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.nav{transition:none}}
</style>

<div class="top">
  <button class="btn navtoggle" id="navt" aria-label="Show the list of areas">☰</button>
  <div class="brand">EXAACT Test Book <small id="ver"></small></div>
  <div class="meter" title="Tests with a result, of all tests">
    <div class="bar" id="topbar" aria-hidden="true"></div><span class="n" id="topn">Loading…</span>
  </div>
  <button class="btn" id="exportBtn">Download Excel</button>
</div>
<div class="wrap">
  <nav class="nav" id="nav" aria-label="Areas and modules"></nav>
  <main class="main" id="main"><p class="lede">Loading the tests…</p></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = {pass:'Pass', fail:'Fail', block:'Blocked', skip:'Not applicable', none:'Not run'};
const KINDS = {scenario:'Scenario', edge:'Edge case', access:'Who may', flow:'Flow', phone:'Phone', screen:'Screen check'};
const store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem('tb:' + k) || 'null'); localStorage.setItem('tb:' + k, JSON.stringify(v)); } catch (e) { return null; } };

let BOOK = null, CASES = [], BYID = {}, RESULTS = {}, db = null, assets = null, user = null, downloads = null, me = null, canWrite = true;
let view = store('view') || {page:'overview'};
let F = Object.assign({q:'', kind:'', tag:'', persona:'', company:'', status:'', liveOnly:false}, store('filters') || {});
let open = new Set(); let shown = 60;

function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function statusOf(id){ return (RESULTS[id] && RESULTS[id].status) || 'none'; }

// ---- data ---------------------------------------------------------------------------
async function boot(){
  try { BOOK = await (await fetch('book.json')).json(); }
  catch (e) { $('#main').innerHTML = '<p class="lede">The tests could not be loaded. Reload the page.</p>'; return; }
  CASES = BOOK.cases; CASES.forEach(c => BYID[c.id] = c);
  $('#ver').textContent = 'built ' + BOOK.version;
  if (location.hash.length > 1 && BYID[location.hash.slice(1)]) { const c = BYID[location.hash.slice(1)]; view = {page:'module', area:c.area, module:c.module}; open.add(c.id); }
  render();
  // capabilities light up when they answer
  const cl = window.claude;
  if (!cl || !cl.use) { notice('Results are not being saved in this view (open it on claude.ai to save).'); return; }
  [db, assets, user, downloads] = await Promise.all(['db','assets','user','downloads'].map(n => cl.use(n).catch(() => null)));
  if (user) { me = await user.me(); const w = await user.can('data.write'); if (w === false) canWrite = false; }
  if (!db) { notice('Results cannot be saved in this view — sign in on claude.ai to keep them.'); canWrite = false; render(); return; }
  for (const a of BOOK.areas) subscribe(a);
}
function subscribe(area){
  db.collection('results').where('area', '==', area).onSnapshot(snap => {
    snap.docChanges().forEach(ch => { if (ch.type === 'removed') delete RESULTS[ch.doc.id]; else RESULTS[ch.doc.id] = ch.doc.data(); });
    scheduleRender();
  }, err => notice('Live results stopped (' + err.code + '). Reload the page.'));
}
let rt = 0; function scheduleRender(){ clearTimeout(rt); rt = setTimeout(() => render(true), 120); }
let noticeText = ''; function notice(t){ noticeText = t; render(true); }

// one write at a time per test
const queues = {};
function save(id, patch){
  if (!db || !canWrite) { toast('Not saved — this view cannot save results.'); return; }
  const c = BYID[id]; const cur = RESULTS[id] || {area:c.area, module:c.module, status:'none', steps:{}, note:'', shots:[], history:[]};
  const next = Object.assign({}, cur, patch, {area:c.area, module:c.module, by: me && me.id || null, at: new Date().toISOString()});
  if (patch.status && patch.status !== cur.status) next.history = [{s:patch.status, by: next.by, at: next.at}].concat(cur.history || []).slice(0, 20);
  RESULTS[id] = next;
  const q = queues[id] || Promise.resolve();
  queues[id] = q.then(() => db.doc('results/' + id).set(next)).catch(e => {
    if (e && e.code === 'invalid_argument') { canWrite = false; toast('You can read but not save results here. Ask the owner to make you a Contributor.'); }
    else toast('Could not save (' + (e && e.code || 'error') + '). Try again.');
  });
}

// ---- counts ---------------------------------------------------------------------------
function counts(list){ const k = {pass:0, fail:0, block:0, skip:0, none:0}; list.forEach(c => k[statusOf(c.id)]++); return k; }
function barHTML(k, total){ const w = s => (100 * k[s] / Math.max(1, total)).toFixed(2) + '%';
  return `<i style="width:${w('pass')};background:var(--pass)"></i><i style="width:${w('fail')};background:var(--fail)"></i><i style="width:${w('block')};background:var(--block)"></i><i style="width:${w('skip')};background:var(--skip)"></i>`; }
function modulesOf(area){ const m = new Map(); CASES.filter(c => c.area === area).forEach(c => m.set(c.module, (m.get(c.module) || 0) + 1)); return [...m.keys()]; }

// ---- render ---------------------------------------------------------------------------
function render(keepScroll){
  if (!BOOK) return;
  const all = counts(CASES), done = CASES.length - all.none;
  $('#topbar').innerHTML = barHTML(all, CASES.length);
  $('#topn').textContent = `${done} of ${CASES.length} tested · ${all.fail} failed · ${all.block} blocked`;
  renderNav();
  const y = window.scrollY;
  // A redraw must never interrupt typing: keep the note being written, and where the cursor is.
  const ae = document.activeElement; const typing = ae && ae.dataset && ae.dataset.note ? {id:ae.dataset.note, v:ae.value, s:ae.selectionStart, e:ae.selectionEnd} : null;
  const m = $('#main');
  if (view.page === 'overview') m.innerHTML = overviewHTML();
  else if (view.page === 'defects') m.innerHTML = listPage('What failed or is blocked', 'Every test marked Fail or Blocked, with its notes and screenshots — this is what gets fixed first.', CASES.filter(c => ['fail','block'].includes(statusOf(c.id))), true);
  else if (view.page === 'how') m.innerHTML = howHTML();
  else if (view.page === 'people') m.innerHTML = peopleHTML();
  else if (view.page === 'area') m.innerHTML = listPage(view.area, 'Every test in this area. Pick a module on the left to narrow it.', CASES.filter(c => c.area === view.area));
  else m.innerHTML = listPage(view.module, view.area, CASES.filter(c => c.area === view.area && c.module === view.module));
  if (noticeText) m.insertAdjacentHTML('afterbegin', `<div class="note warn">${esc(noticeText)}</div>`);
  bindMain(); hydrateShots(); fillNames();
  if (typing) { const t = document.getElementById('note-' + typing.id); if (t) { t.value = typing.v; t.focus(); t.setSelectionRange(typing.s, typing.e); } }
  if (keepScroll) window.scrollTo(0, y);
}
function renderNav(){
  const n = $('#nav'); const on = (p, a, md) => view.page === p && (a === undefined || view.area === a) && (md === undefined || view.module === md) ? 'on' : '';
  const k = counts(CASES.filter(c => ['fail','block'].includes(statusOf(c.id))));
  let h = `<a href="#" data-p="overview" class="${on('overview')}">Overview</a>
    <a href="#" data-p="defects" class="${on('defects')}">What failed or is blocked <span class="c">${k.fail + k.block}</span></a>
    <a href="#" data-p="how" class="${on('how')}">How to use this book</a>
    <a href="#" data-p="people" class="${on('people')}"><b>Start here — users &amp; settings</b></a>`;
  for (const a of BOOK.areas) {
    const list = CASES.filter(c => c.area === a), kk = counts(list);
    h += `<h4>${esc(a)}</h4><a href="#" data-p="area" data-a="${esc(a)}" class="${on('area', a)}">All of ${esc(a)} <span class="c">${list.length - kk.none}/${list.length}</span></a>`;
    if (view.area === a || a === 'Sales') for (const md of modulesOf(a)) {
      const ml = list.filter(c => c.module === md), mk = counts(ml);
      h += `<a href="#" class="mod ${on('module', a, md)}" data-p="module" data-a="${esc(a)}" data-m="${esc(md)}">${esc(md)} <span class="c">${ml.length - mk.none}/${ml.length}${mk.fail ? ' · ' + mk.fail + '✗' : ''}</span></a>`;
    }
  }
  n.innerHTML = h;
  n.querySelectorAll('a[data-p]').forEach(el => el.onclick = e => { e.preventDefault(); view = {page:el.dataset.p, area:el.dataset.a, module:el.dataset.m}; store('view', view); shown = 60; $('#nav').classList.remove('open'); render(); window.scrollTo(0, 0); });
}
function overviewHTML(){
  const all = counts(CASES), steps = CASES.reduce((s, c) => s + c.steps.length, 0);
  let h = `<h1>EXAACT Test Book</h1><p class="lede">${CASES.length.toLocaleString('en-IN')} tests and ${steps.toLocaleString('en-IN')} steps for ${esc(BOOK.site)}, built from the screens as they are on ${esc(BOOK.version)}. Every result, note and screenshot you add is kept here — for you, for anyone you share this with, and for Claude to read and fix.</p>
  <div class="sum"><div><b>${CASES.length - all.none}</b><span>tested</span></div><div><b style="color:var(--pass)">${all.pass}</b><span>passed</span></div><div><b style="color:var(--fail)">${all.fail}</b><span>failed</span></div><div><b style="color:var(--block)">${all.block}</b><span>blocked</span></div><div><b>${all.none}</b><span>not run yet</span></div></div>
  <div class="grid">`;
  for (const a of BOOK.areas) { const list = CASES.filter(c => c.area === a), k = counts(list);
    h += `<div class="tile" data-go-area="${esc(a)}" tabindex="0"><h3>${esc(a)}</h3><div class="bar">${barHTML(k, list.length)}</div><div class="n">${list.length - k.none} of ${list.length} tested${k.fail ? ' · <span style="color:var(--fail)">' + k.fail + ' failed</span>' : ''}${k.block ? ' · ' + k.block + ' blocked' : ''}</div></div>`; }
  h += `</div><div class="note">Start with <b>Start here — users &amp; settings</b> (left menu): it says which test users to create, what each may do, and which company settings to use. Then <b>How to use this book</b>. Tests marked <span class="tag live">test copy only</span> change company-wide settings: run them on a test workspace, never on your live company.</div>`;
  return h;
}
function filtered(list){
  const q = F.q.trim().toLowerCase();
  return list.filter(c => (!F.kind || c.kind === F.kind) && (!F.tag || (c.tags || []).includes(F.tag)) && (!F.persona || c.persona === F.persona) &&
    (!F.company || c.company === F.company || c.company === 'ANY') && (!F.status || statusOf(c.id) === F.status) && (!F.liveOnly || c.live !== false) &&
    (!q || (c.id + ' ' + c.title + ' ' + c.why + ' ' + c.module + ' ' + c.steps.map(s => s.do + ' ' + s.expect).join(' ')).toLowerCase().includes(q)));
}
function listPage(title, sub, list, defects){
  const fl = filtered(list); const kinds = [...new Set(list.map(c => c.kind))]; const tags = [...new Set(list.flatMap(c => c.tags || []))].filter(t => t !== 'screen');
  const personas = [...new Set(list.map(c => c.persona))].sort();

// ---- screenshots ------------------------------------------------------------------------
async function upload(id, files){
  if (!assets) { toast('Screenshots cannot be added in this view.'); return; }
  files = files.filter(f => /^image\/|application\/pdf/.test(f.type)); if (!files.length) { toast('Only pictures and PDFs can be attached.'); return; }
  toast(`Uploading ${files.length} file${files.length > 1 ? 's' : ''}…`);
  const added = [];
  for (const f of files) {
    try { const res = await assets.upload(f, f.type ? undefined : {type:'image/png'}); added.push({id:res.id, name:f.name || 'pasted screenshot', type:res.contentType, at:new Date().toISOString(), by: me && me.id || null}); }
    catch (e) { toast(e && e.code === 'too_large' ? `${f.name} is over 20 MB — make it smaller.` : `${f.name} could not be uploaded (${e && e.code || 'error'}).`); }
  }
  if (added.length) { const r = RESULTS[id] || {}; save(id, {shots:(r.shots || []).concat(added)}); render(true); toast(`${added.length} screenshot${added.length > 1 ? 's' : ''} added.`); }
}
let confirmRm = null;
async function removeShot(id, i, btn){
  if (confirmRm !== id + ':' + i) { confirmRm = id + ':' + i; btn.textContent = 'Remove?'; setTimeout(() => { if (confirmRm === id + ':' + i) { confirmRm = null; btn.textContent = '✕'; } }, 3000); return; }
  confirmRm = null; const r = RESULTS[id] || {}; const shots = (r.shots || []).slice(); const [gone] = shots.splice(i, 1);
  save(id, {shots}); render(true);
  try { await assets.delete(gone.id); } catch (e) { /* the row no longer points at it; harmless if the delete failed */ }
}
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData && e.clipboardData.files || [])]; if (!files.length) return;
  const target = [...open].pop(); if (!target) { toast('Open a test first, then paste the screenshot.'); return; }
  e.preventDefault(); upload(target, files);
});

  <h2 style="font-size:16px;margin-top:20px">5 · The 19 test people — create them top to bottom</h2>

  <div class="steps"><table><thead><tr><th>#</th><th>Name · username</th><th>Role · home office · team</th><th>Reports to</th><th>Sees</th><th>Can</th><th>Cannot</th></tr></thead><tbody>${S.users.map(u => `<tr><td>${u.n}</td><td><b>${esc(u.name)}</b><br><code>${esc(u.user)}</code></td><td><b>${esc(u.roleName)}</b><br>${esc(u.home)} · ${esc(u.teamName)}${u.scope === 'sbu' ? '<br><i>Data scope: only "Industrial"</i>' : ''}${u.pay ? '<br><i>' + esc(u.pay) + '</i>' : ''}</td><td>${esc(u.reports)}</td><td>${esc(u.sees)}</td><td>${esc(u.can)}${opens(u)}</td><td>${esc(u.cannot)}</td></tr>`).join('')}</tbody></table></div>
  <h2 style="font-size:16px;margin-top:20px">6 · Your own organisation chart in EXAACT</h2>
  <p class="lede">An <b>example</b> from your chart — nothing here is built into the software; every company builds its own hierarchy the same way. Role decides what each person may do; Data scope decides which branches and business units they see and approve for; Reports to builds the chain. (Each branch can have its own Branch Manager: tick only that branch on their Data scope.)</p>
  <div class="steps"><table><thead><tr><th>Post on your chart</th><th>Role to pick</th><th>Data scope</th><th>Reports to</th><th>Note</th></tr></thead><tbody>${(S.org || []).map(o => `<tr><td><b>${esc(o.post)}</b></td><td>${esc(o.role)}</td><td>${esc(o.scope)}</td><td>${esc(o.reports)}</td><td>${esc(o.note)}</td></tr>`).join('')}</tbody></table></div>
  <p class="lede" style="margin-top:10px">Quotation approval levels for that chart (Set up Sales → "Who approves, and up to what value"):</p>
  <div class="steps"><table><thead><tr><th>Level</th><th>Approved by</th><th>Value</th><th>What happens</th></tr></thead><tbody>${(S.orgLevels || []).map(o => `<tr><td><b>${esc(o.lvl)}</b></td><td>${esc(o.who)}</td><td>${esc(o.band)}</td><td>${esc(o.note)}</td></tr>`).join('')}</tbody></table></div>
  <h2 style="font-size:16px;margin-top:20px">7 · Watch for these while testing</h2>
  <p class="lede">Measured on the test copy, these disagree with the company's permission rules. They are not fixed yet. If you see them, mark that test Failed with a screenshot.</p>
  <div class="steps"><table><tbody>${S.watch.map(w => `<tr><td><b>${esc(w.who)}</b></td><td>${esc(w.what)}</td></tr>`).join('')}</tbody></table></div>
  <h2 style="font-size:16px;margin-top:20px">8 · Company types</h2>
  <p class="lede">Run the Sales tests once for each type, on a test workspace (applying an industry changes the wording everyone sees).</p>
  <div class="steps"><table><thead><tr><th>Code</th><th>Company type</th><th>What is special</th><th>Industry to apply</th></tr></thead><tbody>${BOOK.companies.map(c => `<tr><td><b>${esc(c.code)}</b></td><td>${esc(c.name)}</td><td>${esc(c.what)}</td><td>${esc(c.industry)}</td></tr>`).join('')}</tbody></table></div>`; }

boot();
})();
</script>
