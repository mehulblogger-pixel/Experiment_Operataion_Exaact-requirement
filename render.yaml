# One-click deploy blueprint for Render.com (no terminal needed).
# Render reads this file, creates the database + web app, runs migrations and
# seeding automatically, and turns on HTTPS. You only type an admin password.
#
# See docs/DEPLOY_EASY.md for the click-by-click guide.

databases:
  - name: inspexops-db
    databaseName: inspexops
    user: inspexops
    plan: basic-256mb   # small paid Postgres; change to a bigger plan anytime

services:
  - type: web
    name: inspexops
    runtime: python
    plan: starter        # small paid web instance (stays online 24x7)
    region: singapore    # closest Render region to India; change if you prefer
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "python manage.py migrate && python manage.py seed_masters && (python manage.py createsuperuser --noinput || true)"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render generates a strong secret for you
      - key: DJANGO_ALLOWED_HOSTS
        value: "schedule.mghaiapps.com,inspexops.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://schedule.mghaiapps.com"
      - key: DJANGO_TIME_ZONE
        value: "Asia/Kolkata"
      - key: DJANGO_SSL_REDIRECT
        value: "False"               # Render terminates HTTPS at its edge
      # Database connection (filled in automatically from the database above)
      - key: POSTGRES_DB
        fromDatabase: {name: inspexops-db, property: database}
      - key: POSTGRES_USER
        fromDatabase: {name: inspexops-db, property: user}
      - key: POSTGRES_PASSWORD
        fromDatabase: {name: inspexops-db, property: password}
      - key: POSTGRES_HOST
        fromDatabase: {name: inspexops-db, property: host}
      - key: POSTGRES_PORT
        fromDatabase: {name: inspexops-db, property: port}
      # First admin login
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@mghaiapps.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false                  # Render asks YOU to type this when deploying
