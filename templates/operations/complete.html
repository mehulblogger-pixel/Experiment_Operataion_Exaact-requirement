{% extends "base.html" %}
{% block title %}Complete — {{ call.call_ref }}{% endblock %}
{% block content %}
<h1>Mark Job Complete</h1>
<p class="sub">{{ call.call_ref }} · {{ call.client }}</p>

<form method="post" class="stack panel" style="max-width:480px;">
  {% csrf_token %}
  <p>Is an invoice to be raised for this job? (requirement 5g)</p>
  <label><input type="radio" name="invoice_required" value="yes" required> Yes — raise invoice</label>
  <label><input type="radio" name="invoice_required" value="no"> No</label>
  <div style="margin-top:16px;">
    <button class="btn" type="submit">Mark complete</button>
    <a class="btn secondary" href="{% url 'operations:call_detail' call.pk %}">Cancel</a>
  </div>
</form>
{% endblock %}
