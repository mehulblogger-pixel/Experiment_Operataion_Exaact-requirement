{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="panel" style="max-width:380px;margin:40px auto;">
  <h1>Sign in</h1>
  <p class="sub">Inspection Operations Management</p>
  {% if form.errors %}<div class="msg msg-error">Invalid username or password.</div>{% endif %}
  <form method="post" class="stack">
    {% csrf_token %}
    <label for="id_username">Username</label>
    <input class="form-control" type="text" name="username" id="id_username" autofocus required>
    <label for="id_password">Password</label>
    <input class="form-control" type="password" name="password" id="id_password" required>
    <div style="margin-top:16px;"><button class="btn" type="submit">Sign in</button></div>
  </form>
</div>
{% endblock %}
